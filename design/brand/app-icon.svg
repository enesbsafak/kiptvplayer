<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <radialGradient id="space" cx="0.5" cy="0.44" r="0.75">
    <stop offset="0" stop-color="#1b1324"/>
    <stop offset="0.55" stop-color="#0b0b10"/>
    <stop offset="1" stop-color="#050507"/>
  </radialGradient>
  <!-- Doppler: the approaching (left) side of the disk is brighter. -->
  <linearGradient id="band" x1="0" y1="0" x2="1" y2="0" gradientTransform="rotate(-16 0.5 0.5)">
    <stop offset="0" stop-color="#ff8a1f" stop-opacity="0"/>
    <stop offset="0.14" stop-color="#ffb347" stop-opacity="0.9"/>
    <stop offset="0.36" stop-color="#fff1d6"/>
    <stop offset="0.62" stop-color="#ff8a1f"/>
    <stop offset="0.86" stop-color="#d9431a" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#9c2410" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="rim" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
    <stop offset="0" stop-color="#fff4dd"/>
    <stop offset="0.5" stop-color="#ffc77a"/>
    <stop offset="1" stop-color="#ff7a1f"/>
  </linearGradient>
  <radialGradient id="horizon" cx="0.42" cy="0.4" r="0.7">
    <stop offset="0" stop-color="#0d0d14"/>
    <stop offset="1" stop-color="#020203"/>
  </radialGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="wide" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="core" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
  <!-- The part of the disk in front of the hole: below its tilted midline. -->
  <clipPath id="front"><rect x="-400" y="534" width="1824" height="900" transform="rotate(-16 530 534)"/></clipPath>
</defs>

<rect width="1024" height="1024" fill="url(#space)"/>
<!-- Halo of light around everything. -->
<g opacity="0.55" filter="url(#wide)" fill="none" stroke="#ff7a1f" stroke-width="120"><ellipse cx="530" cy="534" rx="360" ry="108" transform="rotate(-16 530 534)"/></g>
<path d="M745.1,448.0 Q856.0,512.0 745.1,576.0L489.9,723.4 Q379.0,787.4 379.0,659.4L379.0,364.6 Q379.0,236.6 489.9,300.6Z" fill="none" stroke="#ff8a1f" stroke-width="70" opacity="0.55" filter="url(#wide)"/>

<!-- Disk, far side (behind the hole). -->
<g fill="none" stroke="url(#band)">
  <g stroke-width="58" opacity="0.6" filter="url(#soft)"><ellipse cx="530" cy="534" rx="360" ry="108" transform="rotate(-16 530 534)"/></g>
  <g stroke-width="16" filter="url(#core)"><ellipse cx="530" cy="534" rx="360" ry="108" transform="rotate(-16 530 534)"/></g>
</g>

<!-- Photon ring and the event horizon. -->
<path d="M745.1,448.0 Q856.0,512.0 745.1,576.0L489.9,723.4 Q379.0,787.4 379.0,659.4L379.0,364.6 Q379.0,236.6 489.9,300.6Z" fill="none" stroke="#ffb347" stroke-width="30" opacity="0.8" filter="url(#soft)"/>
<path d="M745.1,448.0 Q856.0,512.0 745.1,576.0L489.9,723.4 Q379.0,787.4 379.0,659.4L379.0,364.6 Q379.0,236.6 489.9,300.6Z" fill="url(#rim)"/>
<path d="M734.1,452.0 Q838.0,512.0 734.1,572.0L491.9,711.8 Q388.0,771.8 388.0,651.8L388.0,372.2 Q388.0,252.2 491.9,312.2Z" fill="url(#horizon)"/>

<!-- Disk, near side (in front of the hole). -->
<g clip-path="url(#front)" fill="none" stroke="url(#band)">
  <g stroke-width="70" opacity="0.75" filter="url(#soft)"><ellipse cx="530" cy="534" rx="360" ry="108" transform="rotate(-16 530 534)"/></g>
  <g stroke-width="20" filter="url(#core)"><ellipse cx="530" cy="534" rx="360" ry="108" transform="rotate(-16 530 534)"/></g>
  <g stroke-width="6" stroke="#fff6e6" opacity="0.9"><ellipse cx="530" cy="534" rx="360" ry="108" transform="rotate(-16 530 534)"/></g>
</g>
</svg>