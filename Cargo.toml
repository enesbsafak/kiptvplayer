[workspace]
resolver = "2"
members = ["core/crates/kp-core", "core/crates/kp-bridge", "tools/mock-iptv"]

[workspace.package]
edition = "2021"
rust-version = "1.80"
version = "0.1.0"
publish = false

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
unicode-normalization = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1

# The backup key derivation is meant to cost ~0.5 s optimized; unoptimized
# it takes minutes, so debug builds optimize it too.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
