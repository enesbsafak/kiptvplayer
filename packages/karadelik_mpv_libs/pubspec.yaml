name: karadelik_mpv_libs
description: Pinned, SHA-256 verified libmpv and ANGLE binaries for Karadelik IPTV Player. Replaces media_kit_libs_video.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: KaradelikMpvLibsPluginCApi
