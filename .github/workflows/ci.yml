# - every push and pull request: tests on Linux (Rust, end-to-end against the
#   mock provider, Flutter analyze + headless tests; none of them need Windows)
# - pull requests, pushes to main and manual runs: the Windows release build
# - every push: Android (APK build, start on an emulator) and iOS (unsigned
#   device build, start on a simulator)
# - manual runs: the data core on macOS
# Pull requests from forks get a read-only token and no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Also test the data core on macOS
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Rust tests
        run: cargo test --workspace

      - name: End-to-end tests against the mock provider
        run: |
          # The tests only check that streams answer, so a tiny stand-in
          # replaces the generated test media (tools/mock-iptv/make-media.ps1).
          mkdir -p tools/mock-iptv/media
          printf 'mock' > tools/mock-iptv/media/ts1080.ts
          cargo build -p mock-iptv --release
          ./target/release/mock-iptv 8089 &
          sleep 1
          cargo test -p kp-core --test xtream_mock -- --ignored --test-threads=1

      - name: Flutter analyze and tests (headless)
        working-directory: apps/player
        run: |
          flutter pub get
          flutter analyze
          flutter test

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Windows release build
        working-directory: apps/player
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: karadelik-player-windows
          path: apps/player/build/windows/x64/runner/Release
          retention-days: 14

  macos-core:
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Data core tests
        run: cargo test -p kp-core

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Android release build (debug-signed, one APK per ABI)
        working-directory: apps/player
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: karadelik-player-android
          path: apps/player/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/android-smoke.sh apps/player/build/app/outputs/flutter-apk/app-x86_64-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: android-smoke
          retention-days: 14
      # Android TV / Google TV: the same APK on a TV emulator (x86_64 TV
      # images exist from API 36), driven with remote keys.
      - name: Start the app on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TV: 1
          OUT: android-tv-smoke
        with:
          api-level: 36
          arch: x86_64
          target: android-tv
          disable-animations: true
          script: bash tools/android-smoke.sh apps/player/build/app/outputs/flutter-apk/app-x86_64-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-tv-smoke
          path: android-tv-smoke
          retention-days: 14

  ios:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: iOS release build for devices (unsigned)
        working-directory: apps/player
        run: flutter build ios --release --no-codesign
      - name: iOS simulator build
        working-directory: apps/player
        run: flutter build ios --simulator --debug
      - name: Start the app on a simulator
        run: bash tools/ios-smoke.sh apps/player/build/ios/iphonesimulator/Runner.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-smoke
          path: ios-smoke
          retention-days: 14
