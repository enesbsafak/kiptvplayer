[workspace]
resolver = "2"
members = ["core/crates/kp-core", "core/crates/kp-bridge", "tools/mock-iptv"]

[workspace.package]
edition = "2021"
rust-version = "1.80"
version = "0.1.0"
publish = false

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
unicode-normalization = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
